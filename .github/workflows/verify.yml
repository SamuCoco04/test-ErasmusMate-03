name: Verify ErasmusMate

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Sync database
        run: npx prisma db push

      - name: Seed database once
        run: npm run db:seed

      - name: Seed database twice
        run: npm run db:seed

      - name: Run tests
        run: npm run test

      - name: Run lint
        run: npm run lint

      - name: Build app
        run: npm run build
