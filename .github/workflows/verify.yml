name: Verify ErasmusMate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "file:./dev.db"
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          npm_config_fetch_retries: 5
          npm_config_fetch_retry_mintimeout: 20000
          npm_config_fetch_retry_maxtimeout: 120000
          npm_config_audit: false
          npm_config_fund: false
        run: |
          npm ci --include=optional --no-audit --no-fund

          node -e "try { require.resolve('@rollup/rollup-linux-x64-gnu'); console.log('Rollup native dependency present'); } catch { process.exit(1); }" || npm install --no-save --package-lock=false --include=optional --no-audit --no-fund @rollup/rollup-linux-x64-gnu

          node -e "console.log('Rollup native:', require.resolve('@rollup/rollup-linux-x64-gnu'))"

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Sync database
        run: npx prisma db push

      - name: Seed database once
        run: npm run db:seed

      - name: Seed database twice
        run: npm run db:seed

      - name: Run tests
        run: npm run test

      - name: Run lint
        run: npm run lint

      - name: Build app
        run: npm run build
